# 可复现示例任务 1：事实型双子问题检索
name: nobel_physics_2024
question: "Who won the 2024 Nobel Prize in Physics, and for what work was it awarded?"
seed_query: "2024 Nobel Prize in Physics laureates awarded work"
min_relevant_per_subq: 2
max_rounds: 6
sub_questions:
  - id: winners
    text: "Who are the laureates of the 2024 Nobel Prize in Physics"
    keywords: ["Nobel Prize", "Physics", "2024", "laureates"]
    alt_queries:
      - "2024 Nobel Prize in Physics winners John Hopfield Geoffrey Hinton"
  - id: work
    text: "What specific work was the 2024 Physics Nobel awarded for"
    keywords: ["artificial neural networks", "machine learning", "Hopfield network", "Boltzmann machine"]
    alt_queries:
      - "2024 Nobel Physics Prize motivation artificial neural networks machine learning"
